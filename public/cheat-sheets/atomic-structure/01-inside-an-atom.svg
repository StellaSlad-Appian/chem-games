  <title id="01-inside-an-atom-title">Inside an atom</title>
  <desc id="01-inside-an-atom-desc">A nucleus of three filled protons and four hollow neutrons at the centre, surrounded by a fuzzy cloud of small marks that thins out towards the edge and shows where the electrons are likely to be. A key names filled as proton and hollow as neutron, and a note says nothing is to scale: a real nucleus is about 1/100,000 of the atom.</desc>
