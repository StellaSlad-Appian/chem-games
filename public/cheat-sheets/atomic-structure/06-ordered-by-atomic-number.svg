  <title id="06-ordered-by-atomic-number-title">Ordered by atomic number, not by mass</title>
  <desc id="06-ordered-by-atomic-number-desc">Tellurium and iodine side by side as two periodic-table cells. Tellurium is atomic number 52 at 127.60 and iodine is 53 at 126.90, so tellurium is the heavier of the two and the table still places it first.</desc>
  <text x="320" y="30" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#64748b">Ordered by atomic number, not by mass</text>
  <text x="320" y="58" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#64748b">The small number counts the protons.</text>
  <rect x="108" y="76" width="190" height="146" rx="16" fill="none" stroke="#64748b" stroke-width="2" />
  <text x="124" y="108" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ef4444">52</text>
  <text x="203" y="154" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="#64748b">Te</text>
  <text x="203" y="186" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#64748b">Tellurium</text>
  <text x="203" y="210" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#64748b">127.60</text>
  <text x="203" y="250" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#64748b">heavier, but first</text>
  <rect x="342" y="76" width="190" height="146" rx="16" fill="none" stroke="#64748b" stroke-width="2" />
  <text x="358" y="108" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ef4444">53</text>
  <text x="437" y="154" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="#64748b">I</text>
  <text x="437" y="186" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#64748b">Iodine</text>
  <text x="437" y="210" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#64748b">126.90</text>
  <text x="437" y="250" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#64748b">lighter, but second</text>
  <text x="320" y="282" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#64748b">Tellurium has one proton fewer, so it goes first.</text>
