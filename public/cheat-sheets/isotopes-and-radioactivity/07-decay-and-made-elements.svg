  <title id="07-decay-and-made-elements-title">Half-life</title>
  <desc id="07-decay-and-made-elements-desc">A decay curve falling from 100 per cent to 50, 25 and 12.5 per cent at one, two and three half-lives, with a dashed line down to the axis at each. After three half-lives an eighth is left. One half-life is 5730 years for carbon-14 and about 4.5 billion years for uranium-238.</desc>
  <text x="320" y="32" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#64748b">Half-life: half of what is left, every time</text>
