<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="04-weighted-average-title 04-weighted-average-desc">
  <title id="04-weighted-average-title">Why chlorine's relative atomic mass is 35.5</title>
  <desc id="04-weighted-average-desc">A bar showing 75 per cent chlorine-35 and 25 per cent chlorine-37, the smaller part hatched as well as differently filled. Below it a mass scale from 35 to 37 marks the average at 35.5, a quarter of the way along rather than in the middle, and the sum is written out: 0.75 times 35 plus 0.25 times 37 makes 35.5, not 36. A note says the split is rounded and the measured abundances are 75.8 and 24.2 per cent.</desc>
  <defs><pattern id="04-weighted-average-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#64748b" stroke-width="3" /></pattern></defs>
  <text x="320" y="30" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#64748b">Why chlorine comes out at 35.5</text>
  <rect x="60" y="50" width="390" height="42" fill="#059669" fill-opacity="0.28" stroke="#64748b" stroke-width="2.5" />
  <rect x="450" y="50" width="130" height="42" fill="#3b82f6" fill-opacity="0.24" />
  <rect x="450" y="50" width="130" height="42" fill="url(#04-weighted-average-hatch)" fill-opacity="0.5" stroke="#64748b" stroke-width="2.5" />
  <text x="255" y="71" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#64748b">75%</text>
  <text x="515" y="71" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#64748b">25%</text>
  <text x="255" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#64748b">chlorine-35</text>
  <text x="515" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#64748b">chlorine-37</text>
  <path d="M 150 176 L 490 176" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 150 176 L 150 186" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <text x="150" y="204" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#64748b">35</text>
  <path d="M 320 176 L 320 186" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <text x="320" y="204" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#64748b">36</text>
  <path d="M 490 176 L 490 186" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <text x="490" y="204" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#64748b">37</text>
  <path d="M 235 176 L 224 159 L 246 159 Z" fill="#ef4444" />
  <text x="235" y="148" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ef4444">35.5</text>
  <text x="320" y="232" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#64748b">Nearer 35, because 35 is the common one.</text>
  <text x="320" y="270" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#64748b">(0.75 × 35) + (0.25 × 37) = 35.5</text>
  <text x="320" y="300" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#64748b">Not (35 + 37) ÷ 2 = 36. No atom weighs 35.5.</text>
  <text x="320" y="326" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#64748b">The split is rounded: measured, it is 75.8% and 24.2%.</text>
