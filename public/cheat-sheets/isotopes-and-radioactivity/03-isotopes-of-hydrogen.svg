  <desc id="03-isotopes-of-hydrogen-desc">Three hydrogen atoms side by side: one proton, one proton and one neutron, and one proton and two neutrons. Each has a single electron, drawn as one mark in a soft band around the nucleus rather than as a dot on a circle.</desc>
